version: '3.8'

services:
  web:
    build: .
    command: gunicorn govconnect.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=django-secure-production-env-key-for-govconnect-portal
      - ALLOWED_HOSTS=*
      - DATABASE_URL=postgres://govuser:govpass@db:5432/govconnect
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=govconnect
      - POSTGRES_USER=govuser
      - POSTGRES_PASSWORD=govpass
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  celery:
    build: .
    command: celery -A govconnect worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgres://govuser:govpass@db:5432/govconnect
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
