{% extends 'base.html' %}
{% block title %}Update Profile - GovConnect{% endblock %}

{% block content %}
<div class="container my-4">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="premium-card" style="padding:2.5rem;">
        <div class="mb-4">
          <h2 style="font-size:1.6rem;font-weight:800;letter-spacing:-0.03em;margin-bottom:0.4rem;">Profile Settings</h2>
          <p style="color:var(--text-muted);font-size:.9rem;">Refine your demographics to improve AI recommendation accuracy.</p>
        </div>
        
        <form method="POST" action="{% url 'users:update_profile' %}">
          {% csrf_token %}
          
          <div class="mb-3">
            <label for="phone" class="form-label" style="font-weight:500;font-size:.85rem;">Phone Number</label>
            <input type="text" class="form-control" id="phone" name="phone" value="{{ profile.phone|default:'' }}" required>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label for="qualification" class="form-label" style="font-weight:500;font-size:.85rem;">Qualification</label>
              <select class="form-select" id="qualification" name="qualification">
                {% for code, label in qualifications %}
                  <option value="{{ code }}" {% if profile.qualification == code %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6">
              <label for="state" class="form-label" style="font-weight:500;font-size:.85rem;">State / UT</label>
              <select class="form-select" id="state" name="state" required>
                <option value="">Select state</option>
                {% for state in states %}
                  <option value="{{ state.id }}" {% if profile.state and profile.state.id == state.id %}selected{% endif %}>{{ state.name }}</option>
                {% endfor %}
              </select>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label for="occupation" class="form-label" style="font-weight:500;font-size:.85rem;">Occupation</label>
              <select class="form-select" id="occupation" name="occupation">
                {% for code, label in occupations %}
                  <option value="{{ code }}" {% if profile.occupation == code %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6">
              <label for="gender" class="form-label" style="font-weight:500;font-size:.85rem;">Gender</label>
              <select class="form-select" id="gender" name="gender">
                {% for code, label in genders %}
                  <option value="{{ code }}" {% if profile.gender == code %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
              </select>
            </div>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label for="age" class="form-label" style="font-weight:500;font-size:.85rem;">Age</label>
              <input type="number" class="form-control" id="age" name="age" min="1" max="120" value="{{ profile.age }}" required>
            </div>
            <div class="col-md-6">
              <label for="annual_income" class="form-label" style="font-weight:500;font-size:.85rem;">Annual Income (₹)</label>
              <input type="number" class="form-control" id="annual_income" name="annual_income" value="{{ profile.annual_income|floatformat:0 }}" required>
            </div>
          </div>

          <div style="height:1px;background:var(--border-color);margin:1.5rem 0;"></div>
          <p style="font-size:.8rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:1rem;">Notifications</p>
          
          <div class="d-flex flex-column gap-3 mb-4">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="notification_email" name="notification_email" {% if profile.notification_email %}checked{% endif %}>
              <label class="form-check-label" for="notification_email" style="font-size:.9rem;">Email alerts</label>
            </div>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="notification_browser" name="notification_browser" {% if profile.notification_browser %}checked{% endif %}>
              <label class="form-check-label" for="notification_browser" style="font-size:.9rem;">Browser notifications</label>
            </div>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="notification_sms" name="notification_sms" {% if profile.notification_sms %}checked{% endif %}>
              <label class="form-check-label" for="notification_sms" style="font-size:.9rem;">SMS alerts</label>
            </div>
          </div>

          <button type="submit" class="btn btn-gov-primary w-100" style="padding:.75rem;">Save Changes</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
